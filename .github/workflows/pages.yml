name: Deploy WASM to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build WASM release binary
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Stage static site in dist/
        run: |
          rm -rf dist
          mkdir -p dist
          cp web/index.html dist/index.html
          cp target/wasm32-unknown-unknown/release/hearthsand.wasm dist/hearthsand.wasm
          MQ_JS=$(python3 -c '
          import json, pathlib, subprocess
          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--format-version", "1"]))
          pkg = next(p for p in meta["packages"] if p["name"] == "macroquad")
          print(pathlib.Path(pkg["manifest_path"]).parent / "js" / "mq_js_bundle.js")
          ')
          cp "$MQ_JS" dist/mq_js_bundle.js
          if [ -d assets ]; then
            cp -r assets dist/assets
          fi
          ls -lh dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
